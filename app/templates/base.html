<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAT | {% block title %}{% endblock %}</title>
  {{ bootstrap.load_css() }}
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!--  Bootstrap icons-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <!-- Litera Bootstrap theme: https://bootswatch.com/litera/ -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-litera.css') }}"/>
  <!--  Custom css adjustments-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}"/>
  <!--  Website icon-->
  <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
</head>
<body>
  {% include "header.html" %}
  {% block content %}{% endblock %}
  {% include "footer.html" %}
  <!--  Popper-->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <!--  Bootstrap JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

</html>
