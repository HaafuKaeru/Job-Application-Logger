{% extends "base.html" %}

{% block title %}
  Data Viewer
{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-start my-4">
    <div class="col-4">
      <h1>
      All Applications
      </h1>
    </div>
  </div>
  <div class="row mt-2 justify-content-between">
  {% if table %}
    <div class="col">
      <div class="row justify-content-start g-0">
        <div class="col-2">
          <a type="button" class="btn btn-primary btn-md" href="{{ url_for('add')}}">
            <span>
              <i class="bi bi-plus-lg"></i>
            </span>
            New
          </a>
        </div>
        <div class="col-1">
          <a type="button" class="btn btn-secondary btn-md" href="#">
            Edit
          </a>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="row justify-content-end">
        <div class="col-3">
          <label>Sorted by <code>{{ sort_by.upper() }}</code></label>
        </div>
        <div class="col-3">
          <div class="dropdown">
            <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Options
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{{ url_for('data.database', sort_by='date') }}">Date Applied</a></li>
              <li><a class="dropdown-item" href="{{ url_for('data.database', sort_by='company') }}">Company Name</a></li>
              <li><a class="dropdown-item" href="{{ url_for('data.database', sort_by='role') }}">Role Title</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col">
      <div class="container p-4 mt-3 bg-body-tertiary rounded-3">
        <div class="border rounded-3 overflow-auto">
          {% include "table.html" %}
        </div>
      </div>
    </div>
  </div>
  {% else %}
  <div class="col">
    <p class="lead">
      Oof, so empty...
    </p>
  </div>
  {% endif %}
</div>
{% endblock %}
